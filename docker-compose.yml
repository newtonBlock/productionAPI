services:
  agent-api:
    build: .
    ports:
      - "8817:8817"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8817/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
