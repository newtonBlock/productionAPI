name: datahouse CI/CD Self-Hosted Runner

on:
  push:
    branches:
      - main

jobs:
  # job 1: Build the image on GitHub-hosted machines and push to Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/productionAPI:latest


  # job 2: Deploy the image on a self-hosted runner
  deploy:
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - name: Pull and Restart App Container 
        run: |
          # Stop the existing container if it is running
          docker stop productionAPI || true
          docker rm productionAPI || true

          # Pull the latest image from Docker Hub
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/productionAPI:latest

          # Run the updated container with the new image
          docker run -d --name productionAPI -p 80:80 --restart always ${{ secrets.DOCKERHUB_USERNAME }}/productionAPI:latest

          # Clean up dangling images to free up space
          docker image prune -f

    
  